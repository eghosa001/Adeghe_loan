name: loantrack
description: Offline-first loan and microfinance management app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  intl: ^0.20.3
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0
  sqflite_sqlcipher: ^3.4.0
  path: ^1.9.1
  path_provider: ^2.1.6
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.4
  local_auth: ^3.0.2
  uuid: ^4.6.0
  excel: ^2.1.0
  google_fonts: ^8.2.1
  image_picker: ^1.2.3
  file_picker: ^10.3.10
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^12.0.2
  crypto: ^3.0.7
  fl_chart: ^0.69.2
  archive: ^3.6.1
  supabase_flutter: ^2.16.0
  sqflite_common_ffi: ^2.4.2

# Windows desktop needs the encrypted SQLite (SQLCipher) build of
# package:sqlite3 (used by sqflite_common_ffi at runtime on Windows).
# Mobile keeps sqflite_sqlcipher's own native lib — this hook only affects
# the package:sqlite3 native library.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - attached_assets/full_horizontal_logo_1784971585520.png
    - attached_assets/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  windows:
    generate: true
    image_path: attached_assets/app_icon_mark_1024_white_bg.png
    icon_size: 256
  image_path: attached_assets/app_icon_mark_1024_white_bg.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: attached_assets/app_icon_mark_1024_white_bg.png
  remove_alpha_ios: true