name: loantrack
description: Offline-first loan and microfinance management app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ">=0.19.0 <1.0.0"
  flutter_riverpod: ^2.4.9
  go_router: ^6.5.0
  sqflite_sqlcipher: ^3.0.3
  path: ^1.8.3
  path_provider: ^2.1.1
  encrypt: ^5.0.1
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.7
  uuid: ^4.2.1
  logger: ^2.0.2+1
  flex_color_scheme: ^7.3.1
  excel: ^2.0.10
  google_fonts: ^8.0.0
  flutter_local_notifications: ^16.1.0
  file_picker: ^8.0.0
  image_picker: ^1.0.4
  pdf: ^3.10.4
  printing: ^5.11.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <6.0.0"
  build_runner: ^2.4.6
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  mocktail: ^1.0.1

flutter:
  uses-material-design: true
  assets:
    - attached_assets/full_horizontal_logo_1784971585520.png