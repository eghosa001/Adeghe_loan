name: Run sync v2 audit patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[sync-v2-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: python3 tools/apply_sync_v2.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/cloud/cloud_sync_service.dart lib/core/database/migrations.dart lib/core/database/database_service.dart test/cloud/cloud_sync_guard_test.dart
          git diff --cached --quiet || git commit -m 'fix: harden cloud sync conflict ordering and watermarks [sync-v2-bot]'
          git push
