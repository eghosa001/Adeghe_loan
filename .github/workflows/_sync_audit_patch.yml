name: Apply cloud sync audit patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[sync-audit-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch service and schema
        run: |
          python3 <<'PY'
          from pathlib import Path
          service=Path('lib/core/cloud/cloud_sync_service.dart')
          text=service.read_text()
          text=text.replace("import 'dart:io';\n", "import 'dart:convert';\nimport 'dart:io';\n", 1)
          old="final meta=await _readMeta(db);final lastPulled=meta.$2;final watermark=_isoUtcNow();await _setPullFlag(db,true);"
          if old not in text: raise SystemExit('meta snippet not found')
          text=text.replace(old,"final watermark=_isoUtcNow();await _setPullFlag(db,true);",1)
          old="final query=client.from(table).select();final filtered=lastPulled==null?query:query.gte('updated_at',lastPulled);final remoteRows=await _fetchAll(filtered);"
          if old not in text: raise SystemExit('query snippet not found')
          new="""// Pull the complete current table. Offline devices do not share a clock,
        // so a timestamp watermark can permanently hide a valid older-looking
        // remote write. Pagination in _fetchAll keeps memory bounded.
        final remoteRows=await _fetchAll(client.from(table).select());"""
          text=text.replace(old,new,1)
          old="final localUpdated=(localRow['updated_at'] as String?)??'';if(remoteUpdated.compareTo(localUpdated)<=0)continue;"
          if old not in text: raise SystemExit('comparison snippet not found')
          text=text.replace(old,"if(compareSyncRows(localRow,remoteRow)<=0)continue;",1)
          marker="@visibleForTesting bool shouldApplyRemoteTombstone(String? localUpdatedAt,String deletedAt){"
          if marker not in text: raise SystemExit('helper marker not found')
          helper=r'''String _canonicalJson(Object? value){
  if(value is Map){
    final entries=value.entries.toList()..sort((a,b)=>a.key.toString().compareTo(b.key.toString()));
    return '{${entries.map((e)=>'${jsonEncode(e.key.toString())}:${_canonicalJson(e.value)}').join(',')}}';
  }
  if(value is Iterable)return '[${value.map(_canonicalJson).join(',')}]';
  return jsonEncode(value);
}

/// Deterministic LWW comparison. Timestamp is primary; equal timestamps use
/// canonical row JSON so two devices cannot permanently diverge on a tie.
@visibleForTesting int compareSyncRows(Map<String,Object?> local,Map<String,Object?> remote){
  final localUpdated=(local['updated_at'] as String?)??'';
  final remoteUpdated=(remote['updated_at'] as String?)??'';
  final byTimestamp=localUpdated.compareTo(remoteUpdated);
  if(byTimestamp!=0)return byTimestamp;
  return _canonicalJson(local).compareTo(_canonicalJson(remote));
}

'''
          text=text.replace(marker,helper+marker,1)
          service.write_text(text)

          migration=Path('supabase_migrations/20260905_sync_lww_and_watermark_hardening.sql')
          migration.write_text('''-- Prevent stale offline pushes from overwriting newer cloud rows.\ncreate or replace function public.enforce_sync_lww()\nreturns trigger language plpgsql set search_path = public\nas $$\ndeclare old_json text; new_json text;\nbegin\n  if new.updated_at is null or old.updated_at is null then return new; end if;\n  if new.updated_at < old.updated_at then return old; end if;\n  if new.updated_at = old.updated_at then\n    old_json := to_jsonb(old)::text; new_json := to_jsonb(new)::text;\n    if new_json <= old_json then return old; end if;\n  end if;\n  return new;\nend;\n$$;\n\ndo $$\ndeclare t text;\nbegin\n  foreach t in array array['business_profile','customer_groups','customers','loans','payments','savings_accounts','savings_transactions','documents','holidays'] loop\n    execute format('drop trigger if exists aaa_sync_lww_guard on public.%I',t);\n    execute format('create trigger aaa_sync_lww_guard before update on public.%I for each row execute function public.enforce_sync_lww()',t);\n  end loop;\nend\n$$;\n''')

          schema=Path('supabase_schema.sql')
          s=schema.read_text()
          marker='-- ── Upgrade existing deployments (mirror of migrations.dart, SAFE TO RE-RUN) ─'
          if marker not in s: raise SystemExit('schema marker not found')
          block='''-- ── Cloud-sync conflict hardening ────────────────────────────────────────────\n-- Offline timestamps are not globally ordered. The client performs full pulls\n-- and deterministic LWW; this trigger also blocks stale offline pushes.\ncreate or replace function public.enforce_sync_lww()\nreturns trigger language plpgsql set search_path = public\nas $$\ndeclare old_json text; new_json text;\nbegin\n  if new.updated_at is null or old.updated_at is null then return new; end if;\n  if new.updated_at < old.updated_at then return old; end if;\n  if new.updated_at = old.updated_at then\n    old_json := to_jsonb(old)::text; new_json := to_jsonb(new)::text;\n    if new_json <= old_json then return old; end if;\n  end if;\n  return new;\nend;\n$$;\n\ndo $$\ndeclare t text;\nbegin\n  foreach t in array array['business_profile','customer_groups','customers','loans','payments','savings_accounts','savings_transactions','documents','holidays'] loop\n    execute format('drop trigger if exists aaa_sync_lww_guard on public.%I',t);\n    execute format('create trigger aaa_sync_lww_guard before update on public.%I for each row execute function public.enforce_sync_lww()',t);\n  end loop;\nend\n$$;\n\n'''
          schema.write_text(s.replace(marker,block+marker,1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/cloud/cloud_sync_service.dart supabase_migrations/20260905_sync_lww_and_watermark_hardening.sql supabase_schema.sql
          git diff --cached --quiet || git commit -m 'fix: harden cloud sync LWW and watermark [sync-audit-bot]'
          git push
