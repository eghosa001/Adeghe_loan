name: Production build gates

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.6'
          cache: true
      - run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release

  android-debug-sqlcipher-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.6'
          cache: true
      - run: flutter pub get
      - name: Build Android debug APK
        run: flutter build apk --debug

  release-configuration-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production configuration is not committed
        shell: bash
        run: |
          if grep -R -E "tpqyilakpsjmevqgdqur|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9" lib android windows; then
            echo "Committed Supabase project credentials detected."
            exit 1
          fi
          grep -q "SUPABASE_URL" lib/core/cloud/supabase_config.dart
          grep -q "SUPABASE_ANON_KEY" lib/core/cloud/supabase_config.dart
          grep -q "Production release builds require" android/app/build.gradle.kts
