name: Repair portable backup encryption

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'fix: make backups portable with recovery password'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch backup encryption and UI
        shell: python
        run: |
          from pathlib import Path

          p = Path('lib/features/backup/data/backup_service.dart')
          s = p.read_text()
          s = s.replace("  static const List<int> _containerHeader = [0x4c, 0x54, 0x42, 0x4b, 0x31];", "  static const List<int> _legacyContainerHeader = [0x4c, 0x54, 0x42, 0x4b, 0x31];\n  static const List<int> _portableContainerHeader = [0x4c, 0x54, 0x42, 0x4b, 0x32];\n  static const _portableSaltLength = 16;")
          s = s.replace("  static bool isEncryptedContainer(List<int> bytes) {\n    if (bytes.length < _containerHeader.length) return false;\n    for (var i = 0; i < _containerHeader.length; i++) {\n      if (bytes[i] != _containerHeader[i]) return false;\n    }\n    return true;\n  }", "  static bool _hasHeader(List<int> bytes, List<int> header) {\n    if (bytes.length < header.length) return false;\n    for (var i = 0; i < header.length; i++) {\n      if (bytes[i] != header[i]) return false;\n    }\n    return true;\n  }\n\n  static bool isEncryptedContainer(List<int> bytes) =>\n      _hasHeader(bytes, _legacyContainerHeader) ||\n      _hasHeader(bytes, _portableContainerHeader);\n\n  static bool isPortableContainer(List<int> bytes) =>\n      _hasHeader(bytes, _portableContainerHeader);")
          old = """  Future<encrypt.Key> _containerKey() async => encrypt.Key(\n    Uint8List.fromList(\n      sha256.convert(utf8.encode(await _secureStorage.getDatabaseKey())).bytes,\n    ),\n  );\n\n  Future<Uint8List> _encryptContainer(Uint8List plaintext) async {\n    final iv = encrypt.IV.fromSecureRandom(_ivLength);\n    final encrypter = encrypt.Encrypter(\n      encrypt.AES(await _containerKey(), mode: encrypt.AESMode.gcm),\n    );\n    final cipher = encrypter.encryptBytes(plaintext, iv: iv);\n    return Uint8List.fromList([..._containerHeader, ...iv.bytes, ...cipher.bytes]);\n  }\n\n  Future<Uint8List?> _decryptContainer(List<int> bytes) async {\n    if (!isEncryptedContainer(bytes) ||\n        bytes.length <= _containerHeader.length + _ivLength) return null;\n    final ivStart = _containerHeader.length;\n    final iv = encrypt.IV(Uint8List.fromList(\n        bytes.sublist(ivStart, ivStart + _ivLength)));\n    final ciphertext = Uint8List.fromList(bytes.sublist(ivStart + _ivLength));\n    try {\n      final encrypter = encrypt.Encrypter(\n        encrypt.AES(await _containerKey(), mode: encrypt.AESMode.gcm),\n      );\n      return Uint8List.fromList(\n        encrypter.decryptBytes(encrypt.Encrypted(ciphertext), iv: iv),\n      );\n    } catch (_) {\n      return null;\n    }\n  }"""
          new = """  Future<encrypt.Key> _legacyContainerKey() async => encrypt.Key(\n    Uint8List.fromList(\n      sha256.convert(utf8.encode(await _secureStorage.getDatabaseKey())).bytes,\n    ),\n  );\n\n  Future<encrypt.Key> _portableContainerKey(String password, List<int> salt) async {\n    final derived = SecureStorageService.deriveBackupKey(password, salt: salt);\n    return encrypt.Key(Uint8List.fromList(base64Decode(derived)));\n  }\n\n  Future<Uint8List> _encryptContainer(Uint8List plaintext, {String? recoveryPassword}) async {\n    if (recoveryPassword == null || recoveryPassword.isEmpty) {\n      final iv = encrypt.IV.fromSecureRandom(_ivLength);\n      final encrypter = encrypt.Encrypter(\n        encrypt.AES(await _legacyContainerKey(), mode: encrypt.AESMode.gcm),\n      );\n      final cipher = encrypter.encryptBytes(plaintext, iv: iv);\n      return Uint8List.fromList([..._legacyContainerHeader, ...iv.bytes, ...cipher.bytes]);\n    }\n    final salt = Uint8List.fromList(List.generate(_portableSaltLength, (_) => Random.secure().nextInt(256)));\n    final iv = encrypt.IV.fromSecureRandom(_ivLength);\n    final encrypter = encrypt.Encrypter(\n      encrypt.AES(await _portableContainerKey(recoveryPassword, salt), mode: encrypt.AESMode.gcm),\n    );\n    final cipher = encrypter.encryptBytes(plaintext, iv: iv);\n    return Uint8List.fromList([\n      ..._portableContainerHeader,\n      ...salt,\n      ...iv.bytes,\n      ...cipher.bytes,\n    ]);\n  }\n\n  Future<Uint8List?> _decryptContainer(List<int> bytes, {String? recoveryPassword}) async {\n    if (!isEncryptedContainer(bytes)) return null;\n    final portable = isPortableContainer(bytes);\n    if (portable && (recoveryPassword == null || recoveryPassword.isEmpty)) return null;\n    final header = portable ? _portableContainerHeader : _legacyContainerHeader;\n    final headerLength = header.length;\n    if (portable && bytes.length <= headerLength + _portableSaltLength + _ivLength) return null;\n    if (!portable && bytes.length <= headerLength + _ivLength) return null;\n    try {\n      var offset = headerLength;\n      List<int>? salt;\n      if (portable) {\n        salt = bytes.sublist(offset, offset + _portableSaltLength);\n        offset += _portableSaltLength;\n      }\n      final iv = encrypt.IV(Uint8List.fromList(bytes.sublist(offset, offset + _ivLength)));\n      offset += _ivLength;\n      final ciphertext = Uint8List.fromList(bytes.sublist(offset));\n      final key = portable\n          ? await _portableContainerKey(recoveryPassword!, salt!)\n          : await _legacyContainerKey();\n      final encrypter = encrypt.Encrypter(encrypt.AES(key, mode: encrypt.AESMode.gcm));\n      return Uint8List.fromList(\n        encrypter.decryptBytes(encrypt.Encrypted(ciphertext), iv: iv),\n      );\n    } catch (_) {\n      return null;\n    }\n  }"""
          if old not in s: raise SystemExit('backup crypto block not found')
          s = s.replace(old, new, 1)
          s = s.replace("  Future<File> createBackup() async {", "  Future<File> createBackup({String? recoveryPassword}) async {")
          s = s.replace("        final payload = await _encryptContainer(Uint8List.fromList(zipBytes));", "        final payload = await _encryptContainer(Uint8List.fromList(zipBytes), recoveryPassword: recoveryPassword);")
          s = s.replace("  Future<void> restoreBackup(File backupFile) async {", "  Future<void> restoreBackup(File backupFile, {String? recoveryPassword}) async {")
          s = s.replace("        final decrypted = await _decryptContainer(bytes);", "        final decrypted = await _decryptContainer(bytes, recoveryPassword: recoveryPassword);")
          s = s.replace("          throw Exception('This backup was encrypted with a different app key and cannot be restored on this device.');", "          if (BackupService.isPortableContainer(bytes)) {\n            throw Exception('This portable backup requires the recovery password used when it was created.');\n          }\n          throw Exception('This backup was encrypted with a different app key and cannot be restored on this device.');")
          p.write_text(s)

          p = Path('lib/core/security/secure_storage_service.dart')
          s = p.read_text()
          marker = "  static String deriveDocumentKey(String password, {int iterations = 600000}) {\n    return _pbkdf2Hex(password, docDerivationSalt, iterations);\n  }"
          addition = marker + "\n\n  /// Derives a portable backup key from a recovery password and per-backup salt.\n  /// The password is never stored or embedded in the backup.\n  static String deriveBackupKey(String password, {required List<int> salt, int iterations = 600000}) {\n    return _pbkdf2Hex(password, base64UrlEncode(Uint8List.fromList(salt)), iterations);\n  }"
          if marker not in s: raise SystemExit('secure storage marker not found')
          p.write_text(s.replace(marker, addition, 1))

          p = Path('lib/features/backup/presentation/screens/backup_screen.dart')
          s = p.read_text()
          s = s.replace("import 'package:path/path.dart' as path;", "import 'package:path/path.dart' as path;\n\nimport '../../../../core/security/secure_storage_service.dart';")
          old = """  Future<void> _createBackup() async {\n    setState(() => _isBackupRunning = true);\n    try {\n      final dbService = await ref.read(databaseServiceProvider.future);\n      final backup = await _backupService(dbService).createBackup();"""
          new = """  Future<String?> _askRecoveryPassword({required bool forRestore}) async {\n    final controller = TextEditingController();\n    final result = await showDialog<String>(\n      context: context,\n      builder: (context) => AlertDialog(\n        title: Text(forRestore ? 'Recovery password' : 'Protect portable backup'),\n        content: TextField(\n          controller: controller,\n          obscureText: true,\n          autofocus: true,\n          decoration: InputDecoration(\n            labelText: 'Recovery password',\n            hintText: 'At least 16 characters, letters and numbers',\n          ),\n        ),\n        actions: [\n          TextButton(onPressed: () => Navigator.pop(context), child: const Text('Cancel')),\n          FilledButton(onPressed: () => Navigator.pop(context, controller.text), child: Text(forRestore ? 'Restore' : 'Create')),\n        ],\n      ),\n    );\n    controller.dispose();\n    if (result == null) return null;\n    final error = SecureStorageService.recoveryPasswordError(result);\n    if (error != null && mounted) {\n      ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(error)));\n      return null;\n    }\n    return result;\n  }\n\n  Future<void> _createBackup() async {\n    setState(() => _isBackupRunning = true);\n    try {\n      final password = await _askRecoveryPassword(forRestore: false);\n      if (password == null) return;\n      final dbService = await ref.read(databaseServiceProvider.future);\n      final backup = await _backupService(dbService).createBackup(recoveryPassword: password);"""
          if old not in s: raise SystemExit('create UI block not found')
          s = s.replace(old, new, 1)
          s = s.replace("""    try {\n      final dbService = await ref.read(databaseServiceProvider.future);\n      await _backupService(dbService).restoreBackup(backupFile);""", """    try {\n      final password = await _askRecoveryPassword(forRestore: true);\n      if (password == null) return;\n      final dbService = await ref.read(databaseServiceProvider.future);\n      await _backupService(dbService).restoreBackup(backupFile, recoveryPassword: password);""", 1)
          p.write_text(s)

      - name: Test, commit, and remove repair workflow
        shell: bash
        run: |
          git diff --check
          git add lib/features/backup/data/backup_service.dart lib/core/security/secure_storage_service.dart lib/features/backup/presentation/screens/backup_screen.dart
          git commit -m "fix: make backups portable with recovery password"
          git rm .github/workflows/repair-portable-backup.yml
          git commit -m "chore: remove temporary backup repair workflow"
          git push
