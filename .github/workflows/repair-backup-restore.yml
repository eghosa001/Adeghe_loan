name: Repair backup restore

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'fix: make backup restore rollback atomic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair restore transaction
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/features/backup/data/backup_service.dart')
          text = path.read_text()

          old = '''      final rollbackPath = '$targetPath.old';
      final rollbackFile = File(rollbackPath);
      final targetFile = File(targetPath);
      await _databaseService.withExclusiveAccess(() async {
        try {
          if (await rollbackFile.exists()) await rollbackFile.delete();
          if (await targetFile.exists()) {
            await targetFile.rename(rollbackPath);
          }
          await tempFile.rename(targetPath);

          // Replace the encrypted document files so they match the restored DB.
          // This runs inside the exclusive block (atomic with the DB swap) and
          // ALWAYS reconciles: any local document file not present in the backup
          // is removed, so a backup that contains no documents cannot leave stale
          // files from another dataset behind, and a failed reconcile triggers
          // the same rollback that protects the database file.
          final docsDirectory = await _secureDocumentsDirectory();
          final existing = await docsDirectory
              .list()
              .where((e) => e is File)
              .cast<File>()
              .toList();
          for (final file in existing) {
            if (await file.exists()) await file.delete();
          }
          for (final entry in documentFiles.entries) {
            await File(
              join(docsDirectory.path, entry.key),
            ).writeAsBytes(entry.value, flush: true);
          }
        } catch (_) {
          if (await rollbackFile.exists() && !await targetFile.exists()) {
            await rollbackFile.rename(targetPath);
          }
          if (await tempFile.exists()) await tempFile.delete();
          rethrow;
        } finally {
          if (await rollbackFile.exists()) await rollbackFile.delete();
        }
      });
'''

          new = '''      final rollbackPath = '$targetPath.old';
      final rollbackFile = File(rollbackPath);
      final targetFile = File(targetPath);
      final docsDirectory = await _secureDocumentsDirectory();
      final docsRollbackPath = '${docsDirectory.path}.restore-old';
      final docsRollbackDirectory = Directory(docsRollbackPath);
      var databaseSwapped = false;
      var documentsSwapped = false;

      await _databaseService.withExclusiveAccess(() async {
        try {
          // Keep both old datasets until the entire restore has succeeded.
          // In particular, never delete the old DB from a finally block: a
          // document/filesystem failure must still be able to roll the DB back.
          if (await rollbackFile.exists()) await rollbackFile.delete();
          if (await docsRollbackDirectory.exists()) {
            await docsRollbackDirectory.delete(recursive: true);
          }

          if (await targetFile.exists()) {
            await targetFile.rename(rollbackPath);
          }
          databaseSwapped = true;
          await tempFile.rename(targetPath);

          // Swap the whole secure-document directory instead of deleting files
          // one by one. This gives the restore a complete filesystem snapshot to
          // roll back if any new document cannot be written.
          if (await docsDirectory.exists()) {
            await docsDirectory.rename(docsRollbackPath);
          }
          documentsSwapped = true;
          await docsDirectory.create(recursive: true);
          for (final entry in documentFiles.entries) {
            await File(
              join(docsDirectory.path, entry.key),
            ).writeAsBytes(entry.value, flush: true);
          }

          // The new DB and all restored documents are now installed. Retaining
          // rollback copies after this point is unnecessary.
          if (await rollbackFile.exists()) await rollbackFile.delete();
          if (await docsRollbackDirectory.exists()) {
            await docsRollbackDirectory.delete(recursive: true);
          }
        } catch (_) {
          // Roll back documents first, then the database. If a rollback step
          // itself fails, deliberately retain the rollback copies rather than
          // deleting the only known-good dataset.
          try {
            if (documentsSwapped) {
              if (await docsDirectory.exists()) {
                await docsDirectory.delete(recursive: true);
              }
              if (await docsRollbackDirectory.exists()) {
                await docsRollbackDirectory.rename(docsDirectory.path);
              }
            }
          } catch (_) {
            // Preserve docsRollbackDirectory for manual recovery.
          }

          try {
            if (databaseSwapped && await targetFile.exists()) {
              await targetFile.delete();
            }
            if (await rollbackFile.exists() && !await targetFile.exists()) {
              await rollbackFile.rename(targetPath);
            }
          } catch (_) {
            // Preserve rollbackFile for manual recovery.
          }

          if (await tempFile.exists()) await tempFile.delete();
          rethrow;
        }
      });
'''

          if old not in text:
              raise SystemExit('Expected backup restore block was not found; refusing to modify the file.')
          path.write_text(text.replace(old, new, 1))

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-backup-restore.yml
          git add lib/features/backup/data/backup_service.dart
          git diff --cached --check
          git commit -m "fix: make backup restore rollback atomic"
          git push