<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-screen gradient: deep navy (top-left) to dark teal (bottom-right) -->
    <linearGradient id="splashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="45%" stop-color="#0B1F34"/>
      <stop offset="100%" stop-color="#0D2B3E"/>
    </linearGradient>

    <!-- Subtle radial vignette -->
    <radialGradient id="vignette" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#122A40" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0A1628" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold accent gradient for geometric lines -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A847" stop-opacity="0.0"/>
      <stop offset="30%" stop-color="#D4A847" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#D4A847" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#D4A847" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Radiating line gradient from center -->
    <linearGradient id="radiateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4A847" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#D4A847" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Watermark A gradient - very subtle -->
    <linearGradient id="watermarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4A847" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#D4A847" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#D4A847" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Grid pattern for subtle background texture -->
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#D4A847" stroke-opacity="0.015" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="0" y2="60" stroke="#D4A847" stroke-opacity="0.015" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Base gradient background -->
  <rect width="1080" height="1920" fill="url(#splashBg)"/>

  <!-- Subtle grid texture -->
  <rect width="1080" height="1920" fill="url(#gridPattern)"/>

  <!-- Radial vignette for depth -->
  <rect width="1080" height="1920" fill="url(#vignette)"/>

  <!-- Radiating geometric lines from center -->
  <g opacity="0.5">
    <!-- Horizontal line -->
    <line x1="0" y1="960" x2="1080" y2="960" stroke="url(#accentLine)" stroke-width="0.8"/>

    <!-- Vertical line -->
    <line x1="540" y1="0" x2="540" y2="1920" stroke="url(#accentLine)" stroke-width="0.8"/>

    <!-- Diagonal lines radiating from center -->
    <line x1="540" y1="960" x2="0" y2="0" stroke="url(#radiateGrad)" stroke-width="0.6" transform="rotate(0, 540, 960)"/>
    <line x1="540" y1="960" x2="1080" y2="0" stroke="url(#radiateGrad)" stroke-width="0.6"/>
    <line x1="540" y1="960" x2="0" y2="1920" stroke="url(#radiateGrad)" stroke-width="0.6"/>
    <line x1="540" y1="960" x2="1080" y2="1920" stroke="url(#radiateGrad)" stroke-width="0.6"/>

    <!-- Additional radiating lines at 30-degree intervals -->
    <line x1="540" y1="960" x2="540" y2="0" stroke="url(#radiateGrad)" stroke-width="0.4"/>
    <line x1="540" y1="960" x2="1080" y2="960" stroke="url(#radiateGrad)" stroke-width="0.4"/>
    <line x1="540" y1="960" x2="540" y2="1920" stroke="url(#radiateGrad)" stroke-width="0.4"/>
    <line x1="540" y1="960" x2="0" y2="960" stroke="url(#radiateGrad)" stroke-width="0.4"/>

    <!-- Extra diagonal lines -->
    <line x1="540" y1="960" x2="180" y2="320" stroke="url(#radiateGrad)" stroke-width="0.3"/>
    <line x1="540" y1="960" x2="900" y2="320" stroke="url(#radiateGrad)" stroke-width="0.3"/>
    <line x1="540" y1="960" x2="180" y2="1600" stroke="url(#radiateGrad)" stroke-width="0.3"/>
    <line x1="540" y1="960" x2="900" y2="1600" stroke="url(#radiateGrad)" stroke-width="0.3"/>
  </g>

  <!-- Concentric geometric rings emanating from center -->
  <g opacity="0.3" fill="none" stroke="#D4A847" stroke-width="0.5">
    <circle cx="540" cy="960" r="120" stroke-opacity="0.08"/>
    <circle cx="540" cy="960" r="240" stroke-opacity="0.06"/>
    <circle cx="540" cy="960" r="400" stroke-opacity="0.04"/>
    <circle cx="540" cy="960" r="600" stroke-opacity="0.02"/>
  </g>

  <!-- Large decorative diamond shape -->
  <g opacity="0.15" fill="none" stroke="#D4A847" stroke-width="0.6">
    <polygon points="540,660 840,960 540,1260 240,960"/>
    <polygon points="540,740 760,960 540,1180 320,960"/>
  </g>

  <!-- The large watermark letter A - semi-transparent, elegant -->
  <text x="540" y="1040" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-weight="100" font-size="720" letter-spacing="-20"
        fill="url(#watermarkGrad)">A</text>

  <!-- Subtle horizontal accent bars -->
  <g opacity="0.08">
    <rect x="160" y="880" width="760" height="1" fill="#D4A847"/>
    <rect x="160" y="1040" width="760" height="1" fill="#D4A847"/>
  </g>

  <!-- Corner accent marks -->
  <g opacity="0.1" stroke="#D4A847" stroke-width="1" fill="none">
    <!-- Top-left -->
    <polyline points="80,140 80,80 140,80"/>
    <!-- Top-right -->
    <polyline points="940,80 1000,80 1000,140"/>
    <!-- Bottom-left -->
    <polyline points="80,1780 80,1840 140,1840"/>
    <!-- Bottom-right -->
    <polyline points="940,1840 1000,1840 1000,1780"/>
  </g>

  <!-- Subtle floating particles/dots for premium feel -->
  <g opacity="0.15">
    <circle cx="180" cy="340" r="1.5" fill="#D4A847"/>
    <circle cx="860" cy="280" r="1" fill="#D4A847"/>
    <circle cx="120" cy="1200" r="1.2" fill="#D4A847"/>
    <circle cx="940" cy="1400" r="1.5" fill="#D4A847"/>
    <circle cx="300" cy="1680" r="1" fill="#D4A847"/>
    <circle cx="780" cy="520" r="1.3" fill="#D4A847"/>
    <circle cx="680" cy="1700" r="1" fill="#D4A847"/>
    <circle cx="400" cy="220" r="1.2" fill="#D4A847"/>
  </g>
</svg>